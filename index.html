<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ITS.ME — The Sets</title>
  <meta name="theme-color" content="#0f0f10">
  <meta name="description" content="ITS.ME — oversized hoodie + wide-leg sweatpants sets. Cash on delivery, InstaPay, Visa and e-wallets.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f0f10'/%3E%3Ctext x='31' y='41' text-anchor='middle' font-family='Arial,Helvetica,sans-serif' font-weight='800' font-size='26' fill='%23f3f1ec'%3EIM%3C/text%3E%3Ccircle cx='51' cy='40' r='4.2' fill='%23e2262d'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="is-loading mode-hero">

  <!-- preloader -->
  <div id="loader" aria-hidden="true">
    <div class="ld-brand" id="ldBrand"></div>
    <div class="ld-count mono"><span id="ldNum">0</span>%</div>
    <div class="ld-bar"><i id="ldBar"></i></div>
  </div>

  <div id="app">
    <div class="bg" id="bg"></div>
    <div class="bg-glow" id="bgGlow"></div>
    <div class="orbs" id="orbs" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="spot" id="spot" aria-hidden="true"></div>
    <div class="marquee" id="marquee" aria-hidden="true"></div>
    <div class="grain"></div>

    <div class="ghost" id="ghost" aria-hidden="true"></div>
    <div class="shadows" id="shadows" aria-hidden="true"></div>
    <div class="items" id="items"></div>
    <canvas class="fx" id="fx" aria-hidden="true"></canvas>

    <!-- header -->
    <header class="hdr ui">
      <a class="brand" id="brand" href="#" aria-label="Home"></a>
      <div class="hdr-mid mono" id="hdrMid"><span class="rv" id="topA"></span><span class="rv" id="topB"></span></div>
      <div class="hdr-end">
      <button class="lang-btn mono" type="button" data-lang-toggle aria-label="Language"></button>
      <button class="hdr-btn" id="hdrBtn" type="button">
        <span class="hdr-lbl mono rv" id="hdrLbl"></span>
        <span class="hdr-ico" aria-hidden="true">
          <svg class="ico-grid" viewBox="0 0 16 16" width="14" height="14"><circle cx="5" cy="5" r="1.4"/><circle cx="11" cy="5" r="1.4"/><circle cx="5" cy="11" r="1.4"/><circle cx="11" cy="11" r="1.4"/></svg>
          <svg class="ico-play" viewBox="0 0 16 16" width="14" height="14"><path d="M5.2 3.6v8.8L12.4 8z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
        </span>
      </button>
      </div>
    </header>

    <div class="badge ui" id="badge" aria-hidden="true">
      <svg viewBox="0 0 120 120" id="badgeSvg"><defs><path id="bc" d="M60,60 m-45,0 a45,45 0 1,1 90,0 a45,45 0 1,1 -90,0"/></defs><text><textPath href="#bc" id="badgeTxt" textLength="280" lengthAdjust="spacing"></textPath></text></svg>
      <span class="badge-c" id="badgeC"></span>
    </div>
    <button class="deal-pill ui" id="dealPill" type="button"><span class="dp-tag mono"><i></i><b id="dpTag"></b></span><span class="dp-lines" id="dpLines"></span></button>
    <div class="cap cap-l mono ui" id="capL"></div>
    <div class="cap cap-r mono ui" id="capR"></div>
    <div class="side-v mono ui" id="sideV"></div>

    <!-- product info (detail mode) -->
    <section class="info" id="info" aria-live="polite">
      <div class="mono info-eyebrow rv" id="iEyebrow"></div>
      <div class="mono info-cat rv" id="iCat"></div>
      <h1 class="info-name rv" id="iName"></h1>
      <p class="info-desc rv" id="iDesc"></p>
      <div class="info-row" id="iColors">
        <div class="swatches" id="swatches" role="radiogroup"></div>
        <span class="mono color-name rv" id="colorName"></span>
      </div>
      <div class="info-row views mono" id="iView" role="group"></div>
      <div class="info-row sizes mono" id="iSizes"></div>
      <div class="info-row buy" id="iBuy">
        <span class="price" id="iPrice"></span>
        <button class="add" id="addBtn" type="button"><span class="add-lbl"></span><span class="add-ico"><svg class="i-plus" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><svg class="i-ck" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
      </div>
      <div class="info-row perks mono" id="iPerks"></div>
    </section>

    <nav class="dots ui" id="dots" aria-label="Products"></nav>

    <!-- footer -->
    <footer class="ftr ui">
      <div class="ft-left">
        <div class="count" id="count"></div>
        <span class="slash">/</span>
        <div class="label-wrap">
          <div class="label rv" id="label"></div>
          <div class="sublabel mono rv" id="sublabel"></div>
        </div>
        <button class="back mono" id="backBtn" type="button"></button>
      </div>
      <button type="button" class="scroll-hint mono" id="hint"><span class="arr"><svg viewBox="0 0 10 14" width="9" height="13"><path d="M5 1v11M1.5 8.5 5 12l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.1"/></svg></span><span id="hintTxt"></span></button>
      <div class="ft-right">
        <button class="cart-pill" id="cartBtn" type="button">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3 5h10l-.8 8.2H3.8z M5.6 5V4a2.4 2.4 0 0 1 4.8 0v1" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
          <span class="cart-lbl" id="cartLbl"></span>
          <span class="cart-n" id="cartN">0</span>
        </button>
      </div>
    </footer>
  </div>

  <!-- ===== scrolling shop site (slides up over the fixed hero) ===== -->
  <div class="hero-spacer" id="spacer" aria-hidden="true"></div>

  <nav class="snav" id="snav" aria-label="Site">
    <a class="snav-brand" id="snavBrand" href="#"></a>
    <div class="snav-links mono" id="snavLinks"></div>
    <button class="lang-btn mono" type="button" data-lang-toggle aria-label="Language"></button>
    <button class="cart-pill" id="cartBtn2" type="button">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3 5h10l-.8 8.2H3.8z M5.6 5V4a2.4 2.4 0 0 1 4.8 0v1" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
      <span class="cart-lbl"></span>
      <span class="cart-n">0</span>
    </button>
  </nav>

  <main class="site" id="site"></main>

  <!-- index overlay -->
  <div id="index" aria-hidden="true">
    <div class="idx-head"><span class="mono" id="idxTitle"></span><button type="button" class="idx-close mono" id="idxClose"></button></div>
    <div class="idx-grid" id="idxGrid"></div>
  </div>

  <!-- cart drawer -->
  <div id="scrim"></div>
  <aside id="cart" class="view-cart" aria-hidden="true" aria-label="Cart">
    <div class="cart-head"><span id="cartTitle"></span><button type="button" id="cartClose" class="mono"></button></div>
    <div class="cart-body">
      <div class="cart-view v-cart">
        <div class="cart-perks" id="cartPerks"></div>
        <div class="cart-list" id="cartList"></div>
      </div>
      <form class="cart-view v-form" id="coForm" novalidate autocomplete="on">
        <h3 class="co-h mono" id="coDetails"></h3>
        <label class="fld"><span class="mono" id="lName"></span><input name="name" autocomplete="name" required></label>
        <label class="fld"><span class="mono" id="lPhone"></span><input name="phone" type="tel" inputmode="tel" autocomplete="tel" required></label>
        <label class="fld"><span class="mono" id="lCity"></span><select name="city" autocomplete="address-level1" required></select></label>
        <label class="fld"><span class="mono" id="lAddress"></span><textarea name="address" rows="2" autocomplete="street-address" required></textarea></label>
        <label class="fld"><span class="mono" id="lNotes"></span><input name="notes"></label>
        <h3 class="co-h mono" id="coPay"></h3>
        <div class="pay" id="payList" role="radiogroup"></div>
      </form>
      <div class="cart-view v-done">
        <div class="done-ck"><svg viewBox="0 0 24 24" width="28" height="28"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <h3 id="doneTitle"></h3>
        <p id="doneText"></p>
        <button type="button" class="checkout" id="doneBtn"></button>
        <button type="button" class="co-back mono" id="reopenBtn"></button>
      </div>
    </div>
    <div class="cart-foot" id="cartFoot">
      <div class="totals" id="totals"></div>
      <button type="button" id="checkoutBtn" class="checkout"></button>
      <button type="button" id="coBack" class="co-back mono"></button>
    </div>
  </aside>

  <!-- info sheet: size guide / shipping / returns -->
  <div id="sheet" aria-hidden="true">
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <div class="sheet-head"><div class="tabs" id="sheetTabs"></div><button type="button" id="sheetClose" class="mono"></button></div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
  </div>

  <div id="toast" class="mono" role="status"></div>

  <script>
    /* اللغة: الزائر يختار من زرار EN / عربي والاختيار بيتحفظ. لو مفيش اختيار بنتبع لغة المتصفح. */
    (function () {
      var l = '';
      try { l = localStorage.getItem('itsme_lang') || ''; } catch (e) {}
      if (!l) l = /^ar/i.test(navigator.language || '') ? 'ar' : 'en';
      window.__lang = l;
      document.write('<script src="js/config.js"><\/script>');
      if (l === 'ar') document.write('<script src="js/config.ar.js"><\/script>');
      document.write('<script src="js/app.js"><\/script>');
    })();
  </script>
</body>
</html>
